services:
  - type: web
    name: share-thoughts
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh /app/render-start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: share-thoughts-db
          property: connectionString
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SERVE_MEDIA
        value: "True"

databases:
  - name: share-thoughts-db
    plan: free
    region: singapore
    databaseName: share_thoughts
    user: share_thoughts
    ipAllowList: []
